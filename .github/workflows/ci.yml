name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

  plan:
    name: Terraform plan
    needs: terraform
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_VAR_cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
      TF_VAR_auth_jwt_cliente_key: ${{ secrets.JWT_CLIENTE_KEY }}
      TF_VAR_auth_service_auth_key: ${{ secrets.SERVICE_AUTH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars and secrets
        working-directory: .
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
                      GCP_GKE_CLUSTER_NAME JWT_CLIENTE_KEY SERVICE_AUTH_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "vars/secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          API_BASE_URL="${API_BASE_URL:-https://invalid.example}"
          {
            echo "TF_VAR_project_id=$GCP_PROJECT_ID"
            echo "TF_VAR_region=$GCP_REGION"
            echo "TF_VAR_artifact_registry_repository=$GCP_AR_REPOSITORY"
            echo "TF_VAR_auth_api_base_url=$API_BASE_URL"
            echo "TF_VAR_auth_image_tag=latest"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color

name: tf-destroy

on:
  workflow_dispatch:

concurrency:
  group: terraform-infra-k8s
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_VAR_cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
      TF_VAR_auth_jwt_cliente_key: ${{ secrets.JWT_CLIENTE_KEY }}
      TF_VAR_auth_service_auth_key: ${{ secrets.SERVICE_AUTH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars and secrets
        working-directory: .
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          JWT_CLIENTE_ISSUER: ${{ vars.JWT_CLIENTE_ISSUER }}
          JWT_CLIENTE_AUDIENCE: ${{ vars.JWT_CLIENTE_AUDIENCE }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
                      GCP_GKE_CLUSTER_NAME JWT_CLIENTE_KEY SERVICE_AUTH_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "vars/secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          API_BASE_URL="${API_BASE_URL:-https://invalid.example}"
          JWT_CLIENTE_ISSUER="${JWT_CLIENTE_ISSUER:-tech-challenge-cliente}"
          JWT_CLIENTE_AUDIENCE="${JWT_CLIENTE_AUDIENCE:-tech-challenge-cliente}"

          {
            echo "TF_VAR_project_id=$GCP_PROJECT_ID"
            echo "TF_VAR_region=$GCP_REGION"
            echo "TF_VAR_artifact_registry_repository=$GCP_AR_REPOSITORY"
            echo "TF_VAR_auth_api_base_url=$API_BASE_URL"
            echo "TF_VAR_auth_image_tag=latest"
            echo "TF_VAR_auth_jwt_cliente_issuer=$JWT_CLIENTE_ISSUER"
            echo "TF_VAR_auth_jwt_cliente_audience=$JWT_CLIENTE_AUDIENCE"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Delete LoadBalancer services
        working-directory: .
        env:
          CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          CLUSTER_LOCATION: ${{ vars.GCP_REGION }}
        run: |
          if ! gcloud container clusters describe "$CLUSTER_NAME" --region "$CLUSTER_LOCATION" >/dev/null 2>&1; then
            echo "cluster ausente; nada a limpar"
            exit 0
          fi
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --region "$CLUSTER_LOCATION" --dns-endpoint
          kubectl get services --all-namespaces \
            -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' \
          | while read -r namespace name; do
              [[ -n "$name" ]] || continue
              echo "removendo service $namespace/$name"
              kubectl delete service "$name" --namespace "$namespace" --wait
            done

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform destroy
        run: terraform destroy -input=false -auto-approve

name: tf-apply

on:
  workflow_dispatch:

concurrency:
  group: terraform-infra-k8s
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    uses: fiap-vcosta/actions/.github/workflows/tf-apply.yml@main
    with:
      concurrency_group: terraform-infra-k8s
      require_k8s_vars: true

  gateway:
    name: Apply GKE Gateway
    needs: apply
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_VAR_cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars
        working-directory: .
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
                      GCP_GKE_CLUSTER_NAME; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "vars faltando: ${missing[*]}" >&2
            exit 1
          fi

          {
            echo "TF_VAR_project_id=$GCP_PROJECT_ID"
            echo "TF_VAR_region=$GCP_REGION"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Apply GKE Gateway
        env:
          CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          CLUSTER_LOCATION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          gcloud container clusters get-credentials "$CLUSTER_NAME" \
            --region "$CLUSTER_LOCATION" --dns-endpoint
          for _ in $(seq 1 60); do
            if kubectl get crd gateways.gateway.networking.k8s.io >/dev/null 2>&1; then
              break
            fi
            sleep 10
          done
          kubectl get crd gateways.gateway.networking.k8s.io >/dev/null
          export NAMESPACE="$(terraform output -raw k8s_namespace)"
          export GATEWAY_NAME="$(terraform output -raw gke_gateway_name)"
          export API_HOSTNAME="$(terraform output -raw api_hostname)"
          export STATIC_IP_NAME="$(terraform output -raw api_static_ip_name)"
          export SSL_CERTIFICATE_NAME="$(terraform output -raw api_ssl_certificate_name)"
          envsubst '${NAMESPACE} ${GATEWAY_NAME} ${API_HOSTNAME} ${STATIC_IP_NAME} ${SSL_CERTIFICATE_NAME}' \
            < gke-gateway.yaml.tpl > /tmp/gke-gateway.yaml
          kubectl apply -f /tmp/gke-gateway.yaml
          kubectl wait --namespace "$NAMESPACE" --for=condition=Programmed "gateway/${GATEWAY_NAME}" --timeout=900s
          echo "SSL_CERTIFICATE_NAME=$SSL_CERTIFICATE_NAME" >> "$GITHUB_ENV"

      - name: Resumo
        run: |
          set -euo pipefail
          cert_status="$(gcloud compute ssl-certificates describe "$SSL_CERTIFICATE_NAME" --global --format='value(managed.status)')"
          {
            echo "## infra-k8s aplicado"
            echo ""
            echo "- Cluster: \`$(terraform output -raw cluster_name)\`"
            echo "- Namespace: \`$(terraform output -raw k8s_namespace)\`"
            echo "- Gateway do GKE: \`$(terraform output -raw gke_gateway_name)\` (listener \`https\`)"
            echo "- Backend: \`https://$(terraform output -raw api_hostname)\`"
            echo "- IP do backend: \`$(terraform output -raw api_static_ip)\` (\`$(terraform output -raw api_static_ip_name)\`)"
            echo "- Certificado do backend: \`$SSL_CERTIFICATE_NAME\` ($cert_status)"
            echo "- Entrada (apex): \`https://$(terraform output -raw gateway_entry_hostname)\`"
            echo "- Entrada IP (A do apex no Cloud DNS): \`$(terraform output -raw gateway_entry_ip)\` (\`$(terraform output -raw gateway_entry_ip_name)\`)"
            echo ""
            echo "Sem HTTPRoute de serviço, o prefixo público responde 404 no Gateway do GKE. \`/system\` não está no OpenAPI."
            echo "O certificado do backend precisa estar Active antes do API Gateway conseguir chamá-lo."
          } >> "$GITHUB_STEP_SUMMARY"

name: tf-apply

on:
  workflow_dispatch:

concurrency:
  group: terraform-infra-k8s
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: Terraform apply
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: terraform
    env:
      TF_VAR_cluster_name: ${{ vars.GCP_GKE_CLUSTER_NAME }}
      TF_VAR_auth_jwt_cliente_key: ${{ secrets.JWT_CLIENTE_KEY }}
      TF_VAR_auth_service_auth_key: ${{ secrets.SERVICE_AUTH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars and secrets
        working-directory: .
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          DOMAIN: ${{ vars.DOMAIN }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          JWT_CLIENTE_ISSUER: ${{ vars.JWT_CLIENTE_ISSUER }}
          JWT_CLIENTE_AUDIENCE: ${{ vars.JWT_CLIENTE_AUDIENCE }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY \
                      GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL \
                      GCP_GKE_CLUSTER_NAME DOMAIN JWT_CLIENTE_KEY SERVICE_AUTH_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "vars/secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          JWT_CLIENTE_ISSUER="${JWT_CLIENTE_ISSUER:-tech-challenge-cliente}"
          JWT_CLIENTE_AUDIENCE="${JWT_CLIENTE_AUDIENCE:-tech-challenge-cliente}"

          {
            echo "TF_VAR_project_id=$GCP_PROJECT_ID"
            echo "TF_VAR_region=$GCP_REGION"
            echo "TF_VAR_artifact_registry_repository=$GCP_AR_REPOSITORY"
            echo "TF_VAR_auth_api_base_url=https://api.${DOMAIN}"
            echo "TF_VAR_auth_jwt_cliente_issuer=$JWT_CLIENTE_ISSUER"
            echo "TF_VAR_auth_jwt_cliente_audience=$JWT_CLIENTE_AUDIENCE"
          } >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve

      - name: Resumo
        run: |
          set -euo pipefail
          {
            echo "## infra-k8s aplicado"
            echo ""
            echo "- Cluster: \`$(terraform output -raw cluster_name)\`"
            echo "- Auth URL (run.app): \`$(terraform output -raw auth_service_uri)\`"
            echo "- Auth hostname: \`$(terraform output -raw auth_hostname)\`"
            echo "- API hostname: \`$(terraform output -raw api_hostname)\`"
            echo "- API static IP: \`$(terraform output -raw api_static_ip)\` (\`$(terraform output -raw api_static_ip_name)\`)"
            echo "- Auth image: \`$(terraform output -raw auth_image)\`"
            echo "- Auth API_BASE_URL: \`https://api.${{ vars.DOMAIN }}\`"
            echo "- Entrada (apex): \`https://$(terraform output -raw gateway_entry_hostname)\`"
            echo "- Entrada IP (A do apex no Cloud DNS): \`$(terraform output -raw gateway_entry_ip)\` (\`$(terraform output -raw gateway_entry_ip_name)\`)"
          } >> "$GITHUB_STEP_SUMMARY"
